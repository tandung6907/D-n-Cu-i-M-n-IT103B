<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - QuizForge</title>
    <link rel="stylesheet" href="../css/register.css" />
  </head>
  <body>
    <header class="header">
      <h1>Trang Đăng Ký</h1>
    </header>
    <main class="main">
      <section class="title">
        <h2>Đăng Ký</h2>
        <p>
          QuizForge – Nền tảng sáng tạo bài kiểm tra trực tuyến, giúp bạn dễ
          dàng thiết kế, chia sẻ và thực hiện các bài kiểm tra một cách nhanh
          chóng và hiệu quả!
        </p>
      </section>

      <section class="form-register">
        <form action="">
          <div class="register-box">
            <label for="name-register">Họ và tên</label>
            <input
              type="text"
              name="Tên Đăng Nhập"
              id="name-register"
              placeholder="Họ và tên"
              class="input-center"
            />
            <br />
          </div>
          <div class="register-box">
            <label for="email-register">Địa chỉ email</label>
            <input
              type="text"
              name="Địa chỉ Email"
              id="email-register"
              placeholder="Địa chỉ email"
              class="input-center"
            />
            <br />
          </div>
          <div class="register-box">
            <label for="pass-register">Mật khẩu</label>
            <input
              type="text"
              name="Mật Khẩu"
              id="pass-register"
              placeholder="Mật khẩu"
              class="input-center"
            />
            <br />
          </div>
          <div class="register-box">
            <label for="check-pass">Xác nhận mật khẩu</label>
            <input
              type="text"
              name="Xác nhận mật khẩu"
              id="check-pass"
              placeholder="Nhập lại mật khẩu"
              class="input-center"
            />
            <br />
          </div>

          <button type="submit" id="btn-register">Đăng Ký</button>
        </form>

        <p class="login-link">
          Đã có tài khoản?
          <a href="../pages/login.html">Đăng Nhập</a>
        </p>
      </section>
    </main>
  </body>
</html>
