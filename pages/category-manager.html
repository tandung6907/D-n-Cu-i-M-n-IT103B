      <!-- POPUP THÊM / SỬA -->
      <div class="overlay" id="overlay"></div>

      <div class="popup" id="popup-form">
        <div class="popup-header">
          <h2 class="popup-title" id="popup-title">Thêm danh mục</h2>
          <button class="popup-close" id="popup-close">&times;</button>
        </div>
        <div class="popup-body">
          <div class="form-group">
            <label>Tên danh mục</label>
            <input
              type="text"
              id="category-name"
              placeholder="Nhập tên danh mục..."
            />
            <span class="error-name"></span>
          </div>
          <div class="form-group">
            <label>Icon danh mục</label>
            <div class="file-input-wrapper">
              <label for="category-img" class="btn-file"> 📁 Chọn Icon </label>
              <input type="file" id="category-img" accept="image/*" />
              <span class="file-name" id="file-name">Chưa chọn ảnh</span>
            </div>
            <img id="preview-img" src="" alt="preview" />
          </div>
        </div>
        <div class="popup-footer">
          <button class="btn-cancel" id="btn-cancel">Huỷ</button>
          <button class="btn-save" id="btn-save">Lưu</button>
        </div>
      </div>

      <!-- POPUP XÁC NHẬN XOÁ -->
      <div class="popup popup-confirm" id="popup-confirm">
        <div class="popup-header">
          <h2 class="popup-title">Xác nhận xoá</h2>
        </div>
        <div class="popup-body">
          <p>
            Bạn có chắc muốn xoá danh mục
            <strong id="confirm-name"></strong> không?
          </p>
        </div>
        <div class="popup-footer">
          <button class="btn-cancel" id="btn-cancel-delete">Huỷ</button>
          <button class="btn-delete-confirm" id="btn-confirm-delete">
            Xoá
          </button>
        </div>
