<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style/testCountDown.css">
</head>
<body>
    <div id="countdown-container">
    <h2>Sự kiện sẽ bắt đầu sau:</h2>
    <div class="timer">
        <div><span id="days">00</span><p>Ngày</p></div>
        <div><span id="hours">00</span><p>Giờ</p></div>
        <div><span id="minutes">00</span><p>Phút</p></div>
        <div><span id="seconds">00</span><p>Giây</p></div>
    </div>
</div>
    <script src="../script/testCountDown.js"></script>
</body>
</html>
