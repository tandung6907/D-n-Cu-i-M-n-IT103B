<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chuyển hướng</title>
    <link rel="icon" href="../img/20260402-150420.jpg">
    <style>
        * {
            cursor: none;
        }
        .custom-loader-container {
            position: relative;
            width: 220px; 
            height: 220px;
            margin: 20px auto 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- BẮT ĐẦU CSS CHO KHỐI SCENE 3D --- */
        .scene {
            position: absolute;
            width: 200px;
            height: 200px;
            perspective: 800px; /* Tạo chiều sâu 3D */
            z-index: 2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* --- Vòng cầu vồng và container 3D tách biệt, nằm phía trước cube --- */
        .rainbow-scene {
            position: absolute;
            width: 200px;
            height: 200px;
            perspective: 800px;
            z-index: 1; /* Nằm sau khối lập phương */
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            animation: rainbowTransformSequence 5.8s ease-in-out forwards;
        }

        .rainbow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            width: 212px; 
            height: 212px;
            border-radius: 50%;
            opacity: 0.7; 
            background: conic-gradient(red, orange, yellow, green, cyan, blue, violet, red);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff calc(100% - 5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff calc(100% - 5px));
            animation: rotateRainbow 2s linear infinite;
        }

        @keyframes rotateRainbow {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Timeline cho việc tách vòng cầu vồng */
        @keyframes rainbowTransformSequence {
            0%   { transform: translateZ(0); }
            35%  { transform: translateZ(0); } /* Bắt đầu tách */
            45%  { transform: translateZ(50px); } /* Tách ra 50px */
            85%  { transform: translateZ(50px); } /* Giữ vị trí */
            95%  { transform: translateZ(0); } /* Trở về vị trí ban đầu */
            100% { transform: translateZ(0); } /* Dừng lại */
        }

        /* --- Khối lập phương 3D --- */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: cubeSequence 5.8s ease-in-out forwards; /* Tổng timeline là 5.8s (dưới 6s) */
        }

        .cube-face {
            position: absolute;
            width: 200px;
            height: 200px;
            background-size: cover;
            background-position: center;
            background-color: black;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5); /* Đổ bóng nhẹ các góc */
            /* Ban đầu là hình tròn */
            border-radius: 50%;
            transform: translateZ(0);
        }

        /* Timeline cho toàn bộ khối Cube (Xoay phẳng -> Nổi lên -> Bung ra -> Xoay 3D -> Trở về) */
        @keyframes cubeSequence {
            0%   { transform: rotateZ(0deg) scale(1); }
            25%  { transform: rotateZ(360deg) scale(1); } /* Xong 1 vòng 2D */
            35%  { transform: rotateZ(360deg) scale(1.2); } /* Nổi lên */
            45%  { transform: rotateZ(360deg) scale(0.65) rotateX(-20deg) rotateY(-30deg); } /* Bung ra thành cube */
            85%  { transform: rotateZ(360deg) scale(0.65) rotateX(-20deg) rotateY(330deg); } /* Xoay 1 vòng 3D trọn vẹn */
            95%  { transform: rotateZ(360deg) scale(1) rotateX(0deg) rotateY(0deg); } /* Trở về vị trí và hình dạng phẳng ban đầu */
            100% { transform: rotateZ(360deg) scale(1) rotateX(0deg) rotateY(0deg); } /* Dừng lại */
        }

        /* Timeline biến đổi từng mặt cắt từ Hình Tròn -> Mặt Lập Phương -> Hình Tròn */
        .cube-front  { animation: popFront 5.8s ease-in-out forwards; }
        .cube-right  { animation: popRight 5.8s ease-in-out forwards; }
        .cube-back   { animation: popBack 5.8s ease-in-out forwards; }
        .cube-left   { animation: popLeft 5.8s ease-in-out forwards; }
        .cube-top    { animation: popTop 5.8s ease-in-out forwards; }
        .cube-bottom { animation: popBottom 5.8s ease-in-out forwards; }

        /* Ban đầu phẳng (translateZ(0), border-radius: 50%). Bung ra (35%-45%). Trở về (85%-95%). */
        @keyframes popFront  { 0%, 35% { transform: rotateY(0deg) translateZ(0px); border-radius: 50%; } 45%, 85% { transform: rotateY(0deg) translateZ(100px); border-radius: 0%;} 95%, 100% { transform: rotateY(0deg) translateZ(0px); border-radius: 50%;} }
        @keyframes popRight  { 0%, 35% { transform: rotateY(90deg) translateZ(0px); border-radius: 50%; } 45%, 85% { transform: rotateY(90deg) translateZ(100px); border-radius: 0%;} 95%, 100% { transform: rotateY(90deg) translateZ(0px); border-radius: 50%;} }
        @keyframes popBack   { 0%, 35% { transform: rotateY(180deg) translateZ(0px); border-radius: 50%; } 45%, 85% { transform: rotateY(180deg) translateZ(100px); border-radius: 0%;} 95%, 100% { transform: rotateY(180deg) translateZ(0px); border-radius: 50%;} }
        @keyframes popLeft   { 0%, 35% { transform: rotateY(-90deg) translateZ(0px); border-radius: 50%; } 45%, 85% { transform: rotateY(-90deg) translateZ(100px); border-radius: 0%;} 95%, 100% { transform: rotateY(-90deg) translateZ(0px); border-radius: 50%;} }
        @keyframes popTop    { 0%, 35% { transform: rotateX(90deg) translateZ(0px); border-radius: 50%; } 45%, 85% { transform: rotateX(90deg) translateZ(100px); border-radius: 0%;} 95%, 100% { transform: rotateX(90deg) translateZ(0px); border-radius: 50%;} }
        @keyframes popBottom { 0%, 35% { transform: rotateX(-90deg) translateZ(0px); border-radius: 50%; } 45%, 85% { transform: rotateX(-90deg) translateZ(100px); border-radius: 0%;} 95%, 100% { transform: rotateX(-90deg) translateZ(0px); border-radius: 50%;} }
        /* --- KẾT THÚC CSS 3D --- */

        .swal2-html-container #swal-text {
            margin-top: 20px;
            display: block;
            font-weight: 500;
        }
    </style>
    <link rel="stylesheet" href="../style/specialCursor.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const imgUrl = '../img/20260402-150420.jpg';
        
        Swal.fire({
            html: `
                <div class="custom-loader-container">
                    
                    <div class="scene">

                        <div class="rainbow-scene">
                            <div class="rainbow-ring"></div>
                        </div>

                        <div class="cube">
                            <div class="cube-face cube-front" style="background-image: url('${imgUrl}')"></div>
                            <div class="cube-face cube-back" style="background-image: url('${imgUrl}')"></div>
                            <div class="cube-face cube-right" style="background-image: url('${imgUrl}')"></div>
                            <div class="cube-face cube-left" style="background-image: url('${imgUrl}')"></div>
                            <div class="cube-face cube-top" style="background-image: url('${imgUrl}')"></div>
                            <div class="cube-face cube-bottom" style="background-image: url('${imgUrl}')"></div>
                        </div>
                    </div>

                </div>
                <span id="swal-text">Đang chuyển hướng tới trang đăng nhập</span>
            `,
            timer: 6000,
            showConfirmButton: false,
            timerProgressBar: false,
            width: '400px',
            background: '#fff',
        }).then(() => {
            window.location.href = "./logIn.html";
        });
    </script>
    
    <div id="solar-cursor">
        <div class="sun"></div>
        <div class="orbit-line l-1"></div>
        <div class="orbit-line l-2"></div>
        <div class="orbit-line l-3"></div>
        <div class="orbit-line l-4"></div>
        <div class="orbit-line l-5"></div>
        <div class="orbit-line l-6"></div>
        <div class="orbit-line l-7"></div>
        <div class="orbit-line l-8"></div>

        <div class="planet mercury"></div>
        <div class="planet venus"></div>
        <div class="planet earth"></div>
        <div class="planet mars"></div>
        <div class="planet jupiter"></div>
        <div class="planet saturn"></div>
        <div class="planet uranus"></div>
        <div class="planet neptune"></div>
    </div>
</body>
    <script src="../script/specialCursor.js"></script>
</html>
