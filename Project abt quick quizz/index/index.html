<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chuyển hướng</title>
    <link rel="icon" href="../img/20260402-150420.jpg">
    <style>
        * {
            cursor: none;
        }

        /* --- BẮT ĐẦU CSS CHO NỀN GALAXY (MỚI THÊM) --- */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; /* Ngăn scrollbar do các hiệu ứng tràn ra */
            background-color: #050510; /* Nền đen sâu thẳm */
            /* Tạo các đám tinh vân phát sáng đan xen nhau giống vụ nổ Galaxy */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(140, 30, 255, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(20, 100, 255, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(255, 80, 30, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 30%);
        }

        /* Lớp các vì sao lấp lánh đằng sau */
        .stars-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #e0e0ff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 160px 120px, #ffdddd, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 240px 90px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 180px, #cceeff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            animation: twinkle 4s infinite alternate ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }
        /* --- KẾT THÚC CSS CHO NỀN GALAXY --- */

        .custom-loader-container {
            position: relative;
            width: 220px; 
            height: 220px;
            margin: 20px auto 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- BẮT ĐẦU CSS CHO KHỐI SCENE 3D (GIỮ NGUYÊN) --- */
        .scene {
            position: absolute;
            width: 200px;
            height: 200px;
            perspective: 800px; /* Tạo chiều sâu 3D */
            z-index: 2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .rainbow-scene {
            position: absolute;
            width: 200px;
            height: 200px;
            perspective: 800px;
            z-index: 1; 
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            animation: rainbowTransformSequence 5.8s ease-in-out forwards;
            will-change: transform; 
        }

        .rainbow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            width: 212px; 
            height: 212px;
            border-radius: 50%;
            opacity: 0.7; 
            background: conic-gradient(red, orange, yellow, green, cyan, blue, violet, red);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff calc(100% - 5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #fff calc(100% - 5px));
            animation: rotateRainbow 2s linear infinite;
        }

        @keyframes rotateRainbow {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes rainbowTransformSequence {
            0%   { transform: translateZ(0); }
            35%  { transform: translateZ(0); } 
            45%  { transform: translateZ(50px); } 
            85%  { transform: translateZ(50px); } 
            95%  { transform: translateZ(0); } 
            100% { transform: translateZ(0); } 
        }

        .scene-mask {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden; 
            border-radius: 50%; 
            transform-style: flat; 
            z-index: 2; 
            animation: maskSequence 5.8s ease-in-out forwards;
            will-change: border-radius; 
        }

        @keyframes maskSequence {
            0%, 35% { border-radius: 50%; } 
            45%, 85% { border-radius: 0%; } 
            95%, 100% { border-radius: 50%; } 
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: cubeSequence 5.8s ease-in-out forwards; 
            will-change: transform; 
        }

        .cube-face {
            position: absolute;
            width: 200px;
            height: 200px;
            background-size: cover;
            background-position: center;
            background-color: black;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5); 
            transform: translateZ(0);
            border-radius: 0%; 
            will-change: transform; 
        }

        @keyframes cubeSequence {
            0%   { transform: rotateZ(0deg) scale(1); }
            25%  { transform: rotateZ(360deg) scale(1); } 
            35%  { transform: rotateZ(360deg) scale(1.2); } 
            45%  { transform: rotateZ(360deg) scale(0.65) rotateX(-20deg) rotateY(-30deg); } 
            85%  { transform: rotateZ(360deg) scale(0.65) rotateX(-20deg) rotateY(330deg); } 
            95%  { transform: rotateZ(360deg) scale(1) rotateX(0deg) rotateY(0deg); } 
            100% { transform: rotateZ(360deg) scale(1) rotateX(0deg) rotateY(0deg); } 
        }

        .cube-front  { animation: popFront 5.8s ease-in-out forwards; }
        .cube-right  { animation: popRight 5.8s ease-in-out forwards; }
        .cube-back   { animation: popBack 5.8s ease-in-out forwards; }
        .cube-left   { animation: popLeft 5.8s ease-in-out forwards; }
        .cube-top    { animation: popTop 5.8s ease-in-out forwards; }
        .cube-bottom { animation: popBottom 5.8s ease-in-out forwards; }

        @keyframes popFront  { 0%, 35% { transform: rotateY(0deg) translateZ(0px); } 45%, 85% { transform: rotateY(0deg) translateZ(100px); } 95%, 100% { transform: rotateY(0deg) translateZ(0px); } }
        @keyframes popRight  { 0%, 35% { transform: rotateY(90deg) translateZ(0px); } 45%, 85% { transform: rotateY(90deg) translateZ(100px); } 95%, 100% { transform: rotateY(90deg) translateZ(0px); } }
        @keyframes popBack   { 0%, 35% { transform: rotateY(180deg) translateZ(0px); } 45%, 85% { transform: rotateY(180deg) translateZ(100px); } 95%, 100% { transform: rotateY(180deg) translateZ(0px); } }
        @keyframes popLeft   { 0%, 35% { transform: rotateY(-90deg) translateZ(0px); } 45%, 85% { transform: rotateY(-90deg) translateZ(100px); } 95%, 100% { transform: rotateY(-90deg) translateZ(0px); } }
        @keyframes popTop    { 0%, 35% { transform: rotateX(90deg) translateZ(0px); } 45%, 85% { transform: rotateX(90deg) translateZ(100px); } 95%, 100% { transform: rotateX(90deg) translateZ(0px); } }
        @keyframes popBottom { 0%, 35% { transform: rotateX(-90deg) translateZ(0px); } 45%, 85% { transform: rotateX(-90deg) translateZ(100px); } 95%, 100% { transform: rotateX(-90deg) translateZ(0px); } }
        /* --- KẾT THÚC CSS 3D --- */

        .swal2-html-container #swal-text {
            margin-top: 20px;
            display: block;
            font-weight: 500;
        }
    </style>
    <link rel="stylesheet" href="../style/specialCursor.css">
</head>
<body>
    <div class="stars-bg"></div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const imgUrl = '../img/20260402-150420.jpg';
        
        Swal.fire({
            html: `
                <div class="custom-loader-container">
                    
                    <div class="scene">

                        <div class="rainbow-scene">
                            <div class="rainbow-ring"></div>
                        </div>

                        <div class="scene-mask">
                            
                            <div class="cube">
                                <div class="cube-face cube-front" style="background-image: url('${imgUrl}')"></div>
                                <div class="cube-face cube-back" style="background-image: url('${imgUrl}')"></div>
                                <div class="cube-face cube-right" style="background-image: url('${imgUrl}')"></div>
                                <div class="cube-face cube-left" style="background-image: url('${imgUrl}')"></div>
                                <div class="cube-face cube-top" style="background-image: url('${imgUrl}')"></div>
                                <div class="cube-face cube-bottom" style="background-image: url('${imgUrl}')"></div>
                            </div>
                        </div>

                    </div>

                </div>
                <span id="swal-text">Đang chuyển hướng tới trang đăng nhập</span>
            `,
            timer: 6500,
            showConfirmButton: false,
            timerProgressBar: false,
            width: '400px',
            background: '#fff',
            // MỚI: Điều chỉnh backdrop tối mờ (70% opacity) để tôn lên nền galaxy phía sau thay vì che lấp
            backdrop: 'rgba(0, 0, 0, 0.7)' 
        }).then(() => {
            window.location.href = "./logIn.html";
        });
    </script>
    
    <div id="solar-cursor">
        <div class="sun"></div>
        <div class="orbit-line l-1"></div>
        <div class="orbit-line l-2"></div>
        <div class="orbit-line l-3"></div>
        <div class="orbit-line l-4"></div>
        <div class="orbit-line l-5"></div>
        <div class="orbit-line l-6"></div>
        <div class="orbit-line l-7"></div>
        <div class="orbit-line l-8"></div>

        <div class="planet mercury"></div>
        <div class="planet venus"></div>
        <div class="planet earth"></div>
        <div class="planet mars"></div>
        <div class="planet jupiter"></div>
        <div class="planet saturn"></div>
        <div class="planet uranus"></div>
        <div class="planet neptune"></div>
    </div>
</body>
    <script src="../script/specialCursor.js"></script>
</html>
