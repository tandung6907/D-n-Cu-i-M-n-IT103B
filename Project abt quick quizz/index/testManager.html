<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../script/checkLogin.js"></script>
    <title>Test Manager</title>
    <link rel="stylesheet" href="../style/testManager.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik+Distressed&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="header">
        <h2><a href="./mainPages.html" class="tMain">QuizzForge</a></h2>
        <div class="lead">
            <button class="notIndeed"><a href="./categoryManager.html">Danh mục</a></button>
            <button class="smth"><a href="./testManager.html">Bài test</a></button>
            <button class="smth" onclick="logout()">Đăng xuất</button>
        </div>
               <link rel="icon" href="../img/20260402-150420.jpg">

    </div>
    <div class="main">
        <div class="contain">
            <h1>
                Quản lý bài test
            </h1>
            <div class="special">
                <button id="addBtn"><a href="./editTest.html">Thêm bài test</a></button>
                <div class="sortNf">
                    <select name="" id="sorts" onchange="sortItems()">
                        <option value="">Sắp xếp theo</option>
                        <option value="1" ondrop="">Sắp xếp theo số câu hỏi từ nhỏ đến lớn</option>
                        <option value="2">Sắp xếp theo số câu hỏi từ lớn đến nhỏ</option>
                        <option value="3">Sắp xếp theo thời gian từ thấp đến cao</option>
                        <option value="4">Sắp xếp theo thời gian từ cao đến thấp</option>
                    </select>
                    <input type="text" placeholder="Tìm kiếm theo tên" id="found" oninput="searchItems()">
                </div>
            </div>
            <table id="tble" border="0" cellspacing="0">
                <thead>
                    <tr>
                        <th class="id">ID</th>
                        <th class="name">Tên bài test</th>
                        <td>Danh mục</td>
                        <th class="quant">Số câu hỏi</th>
                        <th class="time">Thời gian</th>
                        <th class="action">Hành động</th>
                    </tr>
                </thead>
                <tbody id="toc">
                    
                </tbody>
            </table>
            <div class="pages">
                <button class="special">&lt;</button>
                <button class="current">1</button>
                <button class="other">2</button>
                <button class="other">3</button>
                <button class="other next">&gt;</button>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2025 Quiz App. All rights reserved.</p>
    </div>
    <div class="modal" id="testModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Sửa bài test</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="testName">Test name</label>
                    <input type="text" id="testName" placeholder="Enter new name">
                    <label for="testCategory">Test category</label>
                    <select name="" id="testCategory">
                        <option value="">Chọn danh mục</option>
                            <option value="📚 Lịch sử">📚 Lịch sử</option>
                            <option value="🧠 Khoa học">🧠 Khoa học</option>
                            <option value="🎤 Giải trí">🎤 Giải trí</option>
                            <option value="🏠 Đời sống">🏠 Đời sống</option>
                    </select>
                    <label for="testQuestion">Test question quantity</label>
                    <input type="number" id="testQuestion" placeholder="36">
                    <label for="testTime">Test time(minutes)</label>
                    <input type="number" id="testTime" placeholder="36">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">
                    Hủy
                </button>
                <button class="btn-save" onclick="saveModal()">
                    Lưu
                </button>
            </div>
        </div>
    </div>
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Xác nhận xóa</h3>
            </div>
            <div class="modal-body">
                <p>Bạn chắc chắn muốn xoá bài test này?</p>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeDeleteModal()">Hủy</button>
                <button class="btn-save" onclick="confirmDelete()" style="background-color: rgba(220, 53, 69, 1);">Xóa</button>
            </div>
        </div>
    </div>
    <script src="../script/testManager.js"></script>
</body>

</html>
