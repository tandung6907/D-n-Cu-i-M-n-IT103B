<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Cursor</title>
    <link rel="stylesheet" href="../style/specialCursor.css">
</head>
<body>

    <div id="solar-cursor">
        <div class="sun"></div>

        <div class="orbit-line l-1"></div>
        <div class="orbit-line l-2"></div>
        <div class="orbit-line l-3"></div>
        <div class="orbit-line l-4"></div>
        <div class="orbit-line l-5"></div>
        <div class="orbit-line l-6"></div>
        <div class="orbit-line l-7"></div>
        <div class="orbit-line l-8"></div>

        <div class="planet mercury"></div>
        <div class="planet venus"></div>
        <div class="planet earth"></div>
        <div class="planet mars"></div>
        <div class="planet jupiter"></div>
        <div class="planet saturn"></div>
        <div class="planet uranus"></div>
        <div class="planet neptune"></div>
    </div>

    <script src="../script/specialCursor.js"></script>
</body>
</html>
