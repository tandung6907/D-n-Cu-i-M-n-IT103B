<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Manager</title>
    <link rel="stylesheet" href="../style/categoryManager.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik+Distressed&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="header">
        <h2><a href="./mainPages.html" class="tMain">QuizzForge</a></h2>
        <div class="lead">
            <button class="smth"><a href="./categoryManager.html">Danh mục</a></button>
            <button class="notIndeed"><a href="./testManager.html">Bài test</a></button>
            <button class="smth"><a href="./logIn.html">Đăng xuất</a></button>
        </div>
    </div>
    <div class="main">
        <div class="contain">
            <h1>
                Quản lý danh mục
            </h1>
            <button id="addBtn" onclick="clickAdd()">Thêm danh mục</button>
            <table id="tble" border="0" cellspacing="0">
                <thead>
                    <tr>
                        <th class="id">ID</th>
                        <td>Tên danh mục</td>
                        <th class="action">Hành động</th>
                    </tr>
                </thead>
                <tbody id="tbdy">
                   
                </tbody>
            </table>
            <div class="pages">
                <button class="special">&lt;</button>
                <button class="current">1</button>
                <button class="other">2</button>
                <button class="other">3</button>
                <button class="other next">&gt;</button>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2025 Quiz App. All rights reserved.</p>
    </div>
    <div id="categoryModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Thêm/sửa danh mục</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Tên danh mục</label>
                <input type="text" id="categoryName" placeholder="Đời sống">
                <small id="error-msg" class="error-text">Tên danh mục đã tồn tại</small>
            </div>
            <div class="form-group">
                <label>Emoji</label>
                <input type="text" id="categoryEmoji" placeholder="🏠">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Huỷ</button>
            <button class="btn-save" onclick="saveCategory()">Lưu</button>
        </div>
    </div>
</div>
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Xác nhận xoá</h3>
            <span class="close" onclick="closeDeleteModal()">&times;</span>
        </div>
        <div class="modal-body">
            <p>Bạn chắc chắn muốn xoá category này?</p>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeDeleteModal()">Huỷ</button>
            <button class="btn-save" onclick="confirmDelete()">Xoá</button>
        </div>
    </div>
</div>
    <script src="../script/categoryManager.js"></script>
</body>

</html>
