<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Manager</title>
    <link rel="stylesheet" href="../style/categoryManager.css">
</head>
<body>
    <div class="header">
        <h2>QuizzForge</h2>
        <div class="lead">
            <button class="smth">Danh mục</button>
            <button class="notIndeed">Bài test</button>
            <button class="smth">Đăng xuất</button>
        </div>
    </div>
    <div class="main">
        <div class="contain">
            <h1>
                Quản lý danh mục
            </h1>
            <button id="addBtn">Thêm danh mục</button>
            <table id="tble" border="1" cellspacing = "0">
                <thead>
                    <tr>
                        <th class="id">ID</th>
                        <td>Tên danh mục</td>
                        <th class="action">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="odd">
                        <td class="num">1</td>
                        <td>📚 Lịch sử</td>
                        <td class="grBtn">
                            <button id="updBtn">Sửa</button>
                            <button id="delBtn">Xoá</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="num">2</td>
                        <td>🧠 Khoa học</td>
                        <td class="grBtn">
                            <button id="updBtn">Sửa</button>
                            <button id="delBtn">Xoá</button>
                        </td>
                    </tr>
                    <tr class="odd">
                        <td class="num">3</td>
                        <td>🎤 Giải trí</td>
                        <td class="grBtn">
                            <button id="updBtn">Sửa</button>
                            <button id="delBtn">Xoá</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="num">4</td>
                        <td>🏠 Đời sống</td>
                        <td class="grBtn">
                            <button id="updBtn">Sửa</button>
                            <button id="delBtn">Xoá</button>
                        </td>
                    </tr>
                    <tr class="odd">
                        <td class="num">5</td>
                        <td>📚 Lịch sử</td>
                        <td class="grBtn">
                            <button id="updBtn">Sửa</button>
                            <button id="delBtn">Xoá</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="num">6</td>
                        <td>🧠 Khoa học</td>
                        <td class="grBtn">
                            <button id="updBtn">Sửa</button>
                            <button id="delBtn">Xoá</button>
                        </td>
                    </tr>
                    <tr class="odd">
                        <td class="num">7</td>
                        <td>🎤 Giải trí</td>
                        <td class="grBtn">
                            <button id="updBtn">Sửa</button>
                            <button id="delBtn">Xoá</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="num">8</td>
                        <td>🧠 Khoa học</td>
                        <td class="grBtn">
                            <button id="updBtn">Sửa</button>
                            <button id="delBtn">Xoá</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="pages">
                <button class="special">&lt;</button>
                <button class="current">1</button>
                <button class="other">2</button>
                <button class="other">3</button>
                <button class="other next">&gt;</button>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2025 Quiz App. All rights reserved.</p>
    </div>
    <script src="../script/categoryManager.js"></script>
</body>
</html>
