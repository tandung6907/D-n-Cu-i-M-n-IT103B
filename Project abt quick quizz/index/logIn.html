<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="../style/logIn.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik+Distressed&display=swap"
        rel="stylesheet">
          <link rel="icon" href="../img/20260402-150420.jpg">
<body>
    <div id="bdySi">
        <div id="header">
            <h1>Đăng nhập</h1>
            <p>QuizForge – Nền tảng sáng tạo bài kiểm tra trực tuyến,<br>
                giúp bạn dễ dàng thiết kế, chia sẻ và thực hiện các bài <br>
                kiểm tra một cách nhanh chóng và hiệu quả! </p>
        </div>
        <form action="" id="siForm">
            <label for="siEmail" class="labels">Email </label>
            <input type="email" id="siEmail" placeholder="Địa chỉ email" class="iptInf">
            <p id="error-announcement-mails">Email can't be empty</p>
            <br>
            <label for="siPass" class="labels" id="psw">Password</label>
            <input type="password" id="siPass" placeholder="Mật khẩu" class="iptInf">
            <p id="error-announcement-psw">Password can't be empty</p>
            <br>
            <button onclick="liClick(event)" id="siBtn">Log in</button>
            <p id="asking">Chưa có tài khoản? <a href="./signIn.html">Đăng ký</a></p>
        </form>
    </div>
</body>
<script src="../script/logIn.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</html>
