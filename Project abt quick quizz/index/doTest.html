<head>

    <title>Do test</title>
    <link rel="stylesheet" href="../style/doTest.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <div class="hder">
        <h2><a href="./mainPages.html" class="tMain">QuizzForge</a></h2>

            <button class="moveBtn"><a href="./mainPages.html">Trang chủ</a></button>
            <button class="smth" onclick="logout()">Đăng xuất</button>
        </div>
    </div>
    <div class="main">
        <div class="quickDir">
            <h2>Điều hướng <br> nhanh</h2>
            <div class="groupOfQuestion">
                <button class="current">1</button>
                <button class="aint">2</button>
                <button class="aint">3</button>
                <button class="aint">4</button>
                <button class="aint">5</button>
                <button class="aint">6</button>

                <div class="countDown">
                    <p>Thời gian: 25 phút</p>
                    <p>Còn lại: 23:40 phút</p>

            </div>
            <div class="question">
                <h2>Câu hỏi 1 trên 20:</h2>
                <p>Which is the part of the computer system that one can physically touch?</p>
                <div class="answer">
                    <label><input type="checkbox"> Data</label>
                    <label><input type="checkbox"> Operating systems</label>
                    <label><input type="checkbox"> Hardware</label>
                    <label><input type="checkbox"> Software</label>
                </div>
            </div>
            <div class="grBtn">
                <button id="doneBtn">Hoàn thành</button>
                <div class="navi">
                    <button class="prev">Trước</button>
                    <button class="next">Tiếp</button>
                </div>
            </div>
        </div>
    </div>
