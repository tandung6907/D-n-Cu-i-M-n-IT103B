<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizzForge</title>
    <link rel="stylesheet" href="../style/doTest.css">
</head>

<body>
    <div class="hder">
        <h2>QuizzForge</h2>
        <input type="text" placeholder="Find a test " class="findingNemo">
        <div class="moves">
            <button class="moveBtn">Main page</button>
            <button class="moveBtn">Log out</button>
        </div>
    </div>
    <div class="main">
        <div class="quickDir">
            <h2>Điều hướng <br> nhanh</h2>
            <div class="groupOfQuestion">
                <button class="current">1</button>
                <button class="aint">2</button>
                <button class="aint">3</button>
                <button class="aint">4</button>
                <button class="aint">5</button>
                <button class="aint">6</button>
                <button class="aint">7</button>
                <button class="aint">8</button>
                <button class="aint">9</button>
                <button class="aint">10</button>
                <button class="answered">11</button>
                <button class="aint">12</button>
                <button class="aint">13</button>
                <button class="aint">14</button>
                <button class="aint">15</button>
                <button class="aint">16</button>
                <button class="aint">17</button>
                <button class="aint">18</button>
                <button class="aint">19</button>
                <button class="aint">20</button>
            </div>
            <div class="notice">
                <p>Lưu ý: Đây là danh sách câu hỏi bạn có thể sử dụng để điều hướng.</p>
            </div>
        </div>
        <div class="description">
            <div class="hr">
                <h2>Khoa học máy tính</h2>
                <div class="countDown">
                    <p>Thời gian: 25 phút</p>
                    <p>Còn lại: 23:40 phút</p>
                </div>
            </div>
            <div class="question">
                <h2>Câu hỏi 1 trên 20:</h2>
                <p>Which is the part of the computer system that one can physically touch?</p>
                <div class="answer">
                    <label><input type="checkbox"> Data</label>
                    <label><input type="checkbox"> Operating systems</label>
                    <label><input type="checkbox"> Hardware</label>
                    <label><input type="checkbox"> Software</label>
                </div>
            </div>
            <div class="grBtn">
                <button id="doneBtn">Hoàn thành</button>
                <div class="navi">
                    <button class="prev">Trước</button>
                    <button class="next">Tiếp</button>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2025 Quiz App. All rights reserved.</p>
    </div>
    <script src="../script/doTest.js"></script>
</body>

</html>
